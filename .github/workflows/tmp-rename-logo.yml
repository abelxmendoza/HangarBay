name: tmp-rename-logo
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename logo file
        run: |
          git config user.name "abelxmendoza"
          git config user.email "abelxmendoza@users.noreply.github.com"
          rm -f "Sources/RoboticsControlCenter/hangar-bay-logo.png"
          mv "Sources/RoboticsControlCenter/logo.png" "Sources/RoboticsControlCenter/hangar-bay-logo.png"
          git add -A
          git commit -m "Rename logo.png to hangar-bay-logo.png" || echo "nothing to commit"
          git push

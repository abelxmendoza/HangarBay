name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: VERSION matches the installer
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          grep -q "newVersion = \"$v\"" Installer/Sources/DarkstarInstaller/DarkstarInstallerApp.swift \
            || { echo "::error::Installer newVersion does not match VERSION ($v)"; exit 1; }

      - name: Build app + CLI
        run: swift build

      - name: Test (unit + link + integration + e2e)
        run: swift test

      - name: Build installer
        working-directory: Installer
        run: swift build

      - name: Shell scripts parse
        run: for f in dev.sh Scripts/*.sh "Darkstar Setup.command"; do bash -n "$f"; done
